# Unified chronozarr documentation and demo. Build first: npm --prefix site run build
name = "chronozarr-docs"
compatibility_date = "2026-09-01"
main = "site/worker.js"
routes = [
  { pattern = "chronozarr.org", custom_domain = true },
  { pattern = "www.chronozarr.org", custom_domain = true },
]
[assets]
run_worker_first = true
binding = "ASSETS"
directory = "./site/docs/dist"
not_found_handling = "404-page"
