name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same 7-day release quarantine as the local uv config; uv.lock records it, so `uv sync
  # --locked` fails without it.
  UV_EXCLUDE_NEWER: 7 days

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-extras
      - name: ruff check
        run: uv run ruff check src tests examples scripts
      - name: ruff format
        run: uv run ruff format --check src tests examples scripts
      - name: ty
        run: uv run ty check src
      - name: Unit tests
        run: uv run pytest -q -m unit
      - name: Build distributions
        if: matrix.python-version == '3.11'
        run: uv build

  js:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Install locked dependencies
        working-directory: js
        run: npm ci
      # The pretest script writes the data/spike fixtures that ten of these tests read and a clean checkout lacks
      # (js/e2e/make-node-fixtures.mjs); the glob keeps node's runner away from the Playwright specs in js/e2e.
      - name: Node tests
        working-directory: js
        run: npm test

  browser:
    name: Browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Install locked dependencies
        working-directory: js
        run: npm ci
      - name: Install Chromium
        working-directory: js
        run: npx playwright install --with-deps chromium
      # Headless Chromium on software WebGL (SwiftShader); the webgl fixture fails every test when WebGL2 is missing.
      - name: Browser tests
        working-directory: js
        env:
          PLAYWRIGHT_ARTIFACTS_DIR: ${{ runner.temp }}/playwright
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: ${{ runner.temp }}/playwright
          retention-days: 14

  notebook:
    name: Notebook wheel Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Build and install wheel with locked dependencies
        run: |
          uv build --wheel
          uv export --frozen --all-extras --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/notebook-requirements.txt"
          uv venv --python '${{ matrix.python-version }}' "$RUNNER_TEMP/notebook-env"
          uv pip sync --python "$RUNNER_TEMP/notebook-env/bin/python" "$RUNNER_TEMP/notebook-requirements.txt"
          uv pip install --no-deps --python "$RUNNER_TEMP/notebook-env/bin/python" dist/*.whl
      - name: Generate installed-wheel widget fixtures
        run: uv run --no-project --python "$RUNNER_TEMP/notebook-env/bin/python" python scripts/notebook_ci/prepare.py
      - name: Install browser dependencies
        working-directory: js
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test real notebook renderers
        run: node scripts/notebook_ci/browser.mjs
      - name: Upload notebook evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notebook-python-${{ matrix.python-version }}
          path: |
            data/reports/notebook-ci/*.png
            data/reports/notebook-ci/*result.json
            data/reports/notebook-ci/versions.json
          retention-days: 14
