name: Windows Ctrl-C qualification

# Test-only branch. Build the wheel from frozen main, never the harness branch.
on:
  workflow_dispatch:
    inputs:
      cases:
        type: choice
        options: [all, share-ready]
        default: all

permissions:
  contents: read

env:
  UV_EXCLUDE_NEWER: 7 days
  SOURCE_REF: 87ffc2173742104abfa08baccb050a8658156fec
  QUALIFIED_WHEEL_SHA256: 3e7443bec07a16b9d376cc13217c1fd9e3b17046de46c8a1586b71eec3d3c56f

jobs:
  ctrl-c:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.12.24'
          checksum: 7c38608c8a18ee137d748a1773053b07ec8f3a30fab49aebaa6f4e4efeceb019
          enable-cache: false
      - name: Prepare pinned tools and exact qualified wheel
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $qa = Join-Path $env:RUNNER_TEMP 'ctrlc-qa'
          New-Item -ItemType Directory -Path $qa | Out-Null
          "QA_ROOT=$qa" >> $env:GITHUB_ENV
          "UV_TOOL_DIR=$qa/tools" >> $env:GITHUB_ENV
          "UV_TOOL_BIN_DIR=$qa/bin" >> $env:GITHUB_ENV
          uv run --no-project --python 3.13 python scripts/trial/quickstart_commands.py docs/quickstart.md --out "$qa/steps.json"
          uv run --no-project --python 3.13 python scripts/trial/runner_setup.py cloudflared --dest "$qa/cloudflared" --github-actions
          uv run --no-project --python 3.13 python scripts/trial/runner_setup.py wheel --steps "$qa/steps.json" --out "$qa/wheelhouse" --source-ref $env:SOURCE_REF
          $wheel = Get-Item "$qa/wheelhouse/*.whl"
          if ((Get-FileHash -Algorithm SHA256 $wheel.FullName).Hash.ToLower() -ne $env:QUALIFIED_WHEEL_SHA256) { throw 'Wheel differs from qualified Windows artifact' }
      - name: Install frozen candidate with unchanged seven-day cutoff
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          uv tool install --python 3.13 'chronozarr[geo]==0.5.2' --find-links "$env:QA_ROOT/wheelhouse"
          Copy-Item "$env:UV_TOOL_DIR/chronozarr/uv-receipt.toml" "$env:QA_ROOT/uv-receipt.toml"
      - name: Real Windows console Ctrl-C and cleanup checks
        env:
          QA_CASES: ${{ inputs.cases }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          uv run --no-project --python "$env:UV_TOOL_DIR/chronozarr/Scripts/python.exe" python scripts/trial/windows_ctrl_c.py --cli "$env:UV_TOOL_BIN_DIR/chronozarr.exe" --out "$env:QA_ROOT/results" --cases $env:QA_CASES
      - name: Preserve logs, wheel and receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-ctrlc-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ctrlc-qa/results
            ${{ runner.temp }}/ctrlc-qa/steps.json
            ${{ runner.temp }}/ctrlc-qa/uv-receipt.toml
            ${{ runner.temp }}/ctrlc-qa/wheelhouse/*.whl
          retention-days: 30
