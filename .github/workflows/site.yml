name: Documentation site
on:
  push:
    paths: ['site/**', 'README.md', 'docs/**', 'spec/**', 'examples/bring_your_data/README.md', 'js/README.md', 'js/maplibre/README.md', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', 'README.md', 'docs/**', 'spec/**', 'examples/bring_your_data/README.md', 'js/README.md', 'js/maplibre/README.md', '.github/workflows/site.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
