name: Documentation site
on:
  push:
    paths: ['site/**', 'README.md', 'docs/**', 'spec/**', 'examples/bring_your_data/README.md', 'js/**', 'package.json', 'package-lock.json', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', 'README.md', 'docs/**', 'spec/**', 'examples/bring_your_data/README.md', 'js/**', 'package.json', 'package-lock.json', '.github/workflows/site.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
            js/package-lock.json
      - name: Install locked deployment tooling
        run: npm ci --min-release-age=7
        working-directory: .
      - name: Audit deployment tooling
        run: npm audit
        working-directory: .
      - run: npm ci --min-release-age=7
      - run: npm audit
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:dependencies
      # The site build bundles the viewer (js/support/build-viewer.mjs), which needs esbuild from js/.
      - run: npm ci --min-release-age=7
        working-directory: js
      - run: npm run build
