name: Documentation site
on:
  push:
    paths: ['site/**', 'README.md', 'docs/**', 'spec/**', 'examples/bring_your_data/README.md', 'js/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', 'README.md', 'docs/**', 'spec/**', 'examples/bring_your_data/README.md', 'js/**', '.github/workflows/site.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            js/package-lock.json
      - run: npm ci
      # The site build bundles the viewer (js/support/build-viewer.mjs), which needs esbuild from js/.
      - run: npm ci
        working-directory: js
      - run: npm run build
