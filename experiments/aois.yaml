# AOI definitions for spacetime chunk experiments
# Each AOI: ~25 km x 25 km footprint, chosen for contrasting temporal behavior

aois:
  sahara_tamanrasset:
    label: "Sahara (Tamanrasset, Algeria)"
    description: "Hyper-arid desert, near-zero vegetation change, extreme low temporal entropy"
    bbox: [5.40, 22.70, 5.65, 22.95]   # lon_min, lat_min, lon_max, lat_max
    epsg: 32631  # UTM zone 31N
    expected_behavior: "Best-case for delta encoding: near-zero residuals month-to-month"

  iowa_ames:
    label: "Iowa Cropland (near Ames, IA)"
    description: "Corn/soybean rotation, strong phenological cycle, seasonal snow"
    bbox: [-93.80, 41.95, -93.55, 42.20]  # lon_min, lat_min, lon_max, lat_max
    epsg: 32615  # UTM zone 15N
    expected_behavior: "Stress-test for deltas: large seasonal swings, snow/bare/crop transitions"

  nile_delta:
    label: "Nile Delta (Kafr El Sheikh, Egypt)"
    description: "Irrigated agriculture abutting desert, canals, coastal lagoons"
    bbox: [30.80, 31.00, 31.05, 31.25]
    epsg: 32636  # UTM zone 36N
    expected_behavior: "Sharp green/barren boundary, stable irrigation patterns, water features"

  rondonia_brazil:
    label: "Rondônia Deforestation (Brazil)"
    description: "Amazon fishbone deforestation frontier, forest vs cleared pasture"
    bbox: [-62.90, -10.60, -62.65, -10.35]
    epsg: 32720  # UTM zone 20S
    expected_behavior: "High NDVI contrast at clearing edges, wet/dry season cloud variation"

  lake_mead:
    label: "Lake Mead (NV/AZ, USA)"
    description: "Reservoir with dramatic water level changes in arid landscape"
    bbox: [-114.85, 36.00, -114.60, 36.25]
    epsg: 32611  # UTM zone 11N
    expected_behavior: "Water extent shifts between months, strong water/NDWI signal"

  mekong_delta:
    label: "Mekong Delta (Vietnam)"
    description: "Rice paddies with seasonal flooding cycle, river channels"
    bbox: [105.70, 9.80, 105.95, 10.05]
    epsg: 32648  # UTM zone 48N
    expected_behavior: "Wet/dry rice cycle, flooding extent changes, dense channel network"

# Shared parameters
time_range:
  start: "2023-01-01"
  end: "2024-12-31"

bands:
  - B02  # Blue  (10m)
  - B03  # Green (10m)
  - B04  # Red   (10m)
  - B08  # NIR   (10m)

mask_band: SCL  # Scene Classification Layer (20m, resampled to 10m)

chunk_size: 512  # pixels per side at 10m = 5.12 km
