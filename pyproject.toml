[project]
name = "chronozarr"
version = "0.1.0"
description = "Zarr v3 convention and reader for raster time series with star-delta temporal encoding"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "zarr>=3.1",
    "xarray>=2024.1",
    "click>=8.1",
]

[project.optional-dependencies]
ingest = [
    "pystac>=1.10",
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "rasterio>=1.3",
    "pyyaml>=6.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
chronozarr = "chronozarr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronozarr"]

[tool.ruff]
src = ["src"]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["chronozarr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
markers = [
    "slow: marks tests that process real data",
    "unit: fast isolated tests",
]
