[project]
name = "tileripper"
version = "0.1.0"
description = "Low-cost API for temporally coherent EO basemaps with queryable values"
requires-python = ">=3.11"
dependencies = [
    # STAC / catalog (ingestion pipeline)
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    # Raster IO
    "rasterio>=1.3",
    "rioxarray>=0.15",
    "xarray>=2024.1",
    # Storage
    "zarr>=2.18,<3",
    "numcodecs>=0.12,<0.15",
    # Compute
    "numpy>=1.26",
    "dask[array]>=2024.1",
    "scipy>=1.12",
    # Rendering / QC
    "matplotlib>=3.8",
    "scikit-image>=0.22",
    # Benchmarking
    "duckdb>=1.0",
    # Config
    "pyyaml>=6.0",
    # Utilities
    "tqdm>=4.66",
    "click>=8.1",
    # Coordinate transforms
    "pyproj>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "httpx>=0.27",
]
serve = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spacetime"]

[tool.ruff]
src = ["src"]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["spacetime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that hit remote STAC or process real data",
    "unit: fast isolated tests",
]
